name: Publish Package to npm

on:
  release:
    types: [published]
  # Alternatively, you can trigger on push to main with specific tags
  # push:
  #   tags:
  #     - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    # Required for npm Trusted Publishing (OIDC)
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      # Install dependencies using npm ci for clean, deterministic installs
      - name: Install dependencies
        run: npm ci

      - name: Reproduce generated engine
        run: |
          npm run engine:build
          git diff --exit-code -- src/decoders/zxing/generated engine/wasm/source-lock.json engine/wasm/sbom.spdx.json
          npm run engine:verify

      - name: Install browser test runtimes
        run: npx playwright install --with-deps chromium firefox webkit

      # Verify the exact package that will be published
      - name: Audit, test, and build
        run: |
          npm audit --audit-level=high
          npm run check
          npm test
          npm run test:browser
          npm run build
          npm pack --dry-run

      # Publish using Trusted Publishing (--provenance)
      - name: Publish to npm
        run: npm publish --provenance
