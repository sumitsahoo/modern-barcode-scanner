name: Publish Package to npm

on:
  release:
    types: [published]
  # Alternatively, you can trigger on push to main with specific tags
  # push:
  #   tags:
  #     - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    # Required for npm Trusted Publishing (OIDC)
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      # Install dependencies using npm ci for clean, deterministic installs
      - name: Install dependencies
        run: npm ci

      # Verify the exact package that will be published
      - name: Audit, test, and build
        run: |
          npm audit --audit-level=high
          npm run check
          npm test
          npm run build

      # Publish using Trusted Publishing (--provenance)
      - name: Publish to npm
        run: npm publish --provenance
